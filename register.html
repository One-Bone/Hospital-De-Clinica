<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital de Clinica Montevideo</title>
</head>
<body>
    <div class="register">
        <h1>Registro de usuario</h1>
            <form action="index.html" method="post">
                <label for="username">Nombre:</label>
                <input type="text" id="username" name="username" required><br><br>
                <label for="lastname">Apellido:</label>
                <input type="text" id="lastname" name="lastname" required><br><br>
                <label for="id">Número de cedula:</label>
                <input type="text" id="id" name="id" required><br><br>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required><br><br>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required><br><br>
                <label for="conf-pass">Confirmar contraseña:</label>
                <input type="password" id="conf-pass" name="conf-pass" required><br><br>
                <input type="submit" value="Registrarse"><br><br>
                <label for="register">¿Ya tienes una cuenta?</label>
                <a href="login.html">Inicia sesión aquí</a>
            </form>
    </div>
    <div class="Lateral-Menu">
        <a href="pagina-principal.html">Pagina principal</a>
        <a href="pagina-principal.html#sobre-nosotros">Sobre nosotros</a>
        <a href="contacto.html">Contacto</a>
</body>
</html>
