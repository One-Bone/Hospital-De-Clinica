<!DOCTYPE html>
<html lang="es" data-i18n-file="json/login.json">
<head>
    <meta charset="UTF-8">
    <title data-i18n="page_title">Hospital de Clínica Montevideo</title>
    <link rel="stylesheet" href="css/register-login.css">
</head>
<body>
    <div class="Login">
        <label for="languageSelect" data-i18n="language">Idioma:</label>
        <select id="languageSelect" data-language-select>
            <option value="es">Español</option>
            <option value="en">English</option>
        </select>
        <h1 data-i18n="login_title">Inicio de sesión</h1>

        <form id="loginForm" method="POST" action="php/login.php">
            <label for="id" data-i18n="identity_number">Número de cédula:</label>
            <input type="text" id="id" name="id" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="username" required><br><br>

            <label for="password" data-i18n="password">Contraseña:</label>
            <input type="password" id="password" name="password" maxlength="128" autocomplete="current-password" required><br><br>

            <input type="checkbox" id="remember" name="remember">
            <label for="remember" data-i18n="remember_me">Recuérdame</label><br><br>

            <input type="submit" name="iniciar_sesion" value="Iniciar sesión" data-i18n-value="sign_in"><br><br>

            <label for="register" data-i18n="no_account">¿No tienes una cuenta?</label>
            <a href="register.html" data-i18n="register_here">Regístrate aquí</a>
        </form>
    </div>
    <script src="js/idioma.js"></script>
</body>
</html>
