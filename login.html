<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital de Clinica Montevideo</title>
    <link rel="stylesheet" href="css/register-login.css">
</head>
<body>
    <div class="Login">
        <h1>Inicio de sesión</h1>
        <form action="index.html" method="post">
            <label for="id">Número de cedula:</label>
            <input type="text" id="id" name="id" required><br><br>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required><br><br>
            <label for="conf-pass">Confirmar contraseña:</label>
            <input type="password" id="conf-pass" name="conf-pass" required><br><br>
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Recuérdame</label><br><br>
            <input type="submit" value="Iniciar sesión"><br><br>
            <label for="register">¿No tienes una cuenta?</label>
            <a href="register.html">Regístrate aquí</a>
        </form>
    </div>
    <div class="Lateral-Menu">
        <a href="index.html">Pagina principal</a>
        <a href="index.html#sobre-nosotros">Sobre nosotros</a>
        <a href="contacto.html">Contacto</a>
    </div>
</body>
</html>
