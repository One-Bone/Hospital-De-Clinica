<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital de Clínica Montevideo</title>
    <link rel="stylesheet" href="css/register-login.css">
</head>
<body>
    <div class="Login">
        <h1>Inicio de sesión</h1>
        <!-- Agregamos el ID para enlazarlo con JavaScript -->
        <form id="loginForm">
            <label for="id">Número de cédula:</label>
            <input type="text" id="id" name="id" required><br><br>
            
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required><br><br>
            
            <!-- (El campo de confirmar contraseña fue eliminado porque no es necesario en el Login) -->
            
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Recuérdame</label><br><br>
            
            <input type="submit" value="Iniciar sesión"><br><br>
            
            <label for="register">¿No tienes una cuenta?</label>
            <a href="register.html">Regístrate aquí</a>
        </form>
    </div>
    <div class="Lateral-Menu">
        <a href="index.html">Página principal</a>
        <a href="index.html#sobre-nosotros">Sobre nosotros</a>
        <a href="contacto.html">Contacto</a>
    </div>

    <!-- Vinculamos el archivo JavaScript exclusivo para el Login -->
    <script src="js/login.js"></script>
</body>
</html>
